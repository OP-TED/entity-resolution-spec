id: https://data.europa.eu/ers/schema/ers
name: coreSchema
description: ERS domain layer models for entity resolution
version: 1.0.0
imports:
  - linkml:types
prefixes:
  linkml: https://w3id.org/linkml/
  ers: https://data.europa.eu/ers/schema/ers/
  ere: https://data.europa.eu/ers/schema/ere/
default_prefix: ers
default_range: string

enums:

  UserActionType:
    description: Types of curator actions on entity mention resolutions
    permissible_values:
      ACCEPT_TOP:
        description: Curator accepted the top candidate from ERE
      ACCEPT_ALTERNATIVE:
        description: Curator selected an alternative candidate
      REJECT_ALL:
        description: Curator rejected all candidates


classes:

  EntityMention:
    description: |
      An entity mention is a representation of a real-world entity, as provided by the ERS.
      It contains the entity data, along with metadata like type and format.
    attributes:
      identifiedBy:
        description: |
          The identification triad of the entity mention.
        range: EntityMentionIdentifier
        required: true
      content_type:
        description: |
          A string about the MIME format of `content` (e.g. text/turtle, application/ld+json)
        required: true
      content:
        description: |
          A code string representing the entity mention details (eg, RDF or XML description).
        required: true
      parsed_representation:
        description: |
          JSON representation of the parsed entity data.
      context:
        description: |
          Optional context reference (e.g. notice or document ID).

  EntityMentionIdentifier:
    description: |
      A container that groups the attributes needed to identify an entity mention in a resolution request
      or response.

      As per ERS architectural decision, in the whole ERS and ERE systems, there is always a deterministic
      method to build a canonical identifier from the combination of `sourceId`, `requestId` and `entityType`
      (eg, string concatenation plus some prefix). Similarly, a cluster ID (mentioned in various places in 
      in this hereby ERE service schema) can be built from an entity that is initially the only cluster member.
    attributes:
      source_id:
        description: |
          The ID or URI of the ERS client that originated the request. This identifies an application or a 
          person accessing the ERS system.
        required: true
      request_id:
        description: |
          A string representing the unique ID of the request made to the ERS system. In general, this is unique
          only within the scope of the source and the entity type, ie, within `sourceId` and `entityType`. 
          
          Moreover, this is **not** the same as `ereRequestId`, which instead, is internal to the ERE and is 
          used to match responses to requests.
        range: string
        required: true
      entity_type:
        description: |
          A string representing the entity type (based on CET). This is typically a URI.

          Note that this is at this level, and not at `EntityMention`, since, as said above, 
          it's needed to identify the entity, even when its content is not present. For the same
          reason, it's used both for `EREResolutionRequest` and `EREResolutionResponse` messages.,
        required: true

  LookupState:
    description: |
      Tracks the resolution state for entity mentions from a particular source.
      Records when the source was last resolved against the canonical clustering.
    attributes:
      source_id:
        description: |
          The ID or URI of the ERS client (originator) for which we track lookup state.
        required: true
      last_snapshot:
        range: datetime
        description: |
          Timestamp of the last resolution operation for this source.
          Used to determine if a refreshBulk or other update is needed.
        required: true

  ClusterReference:
    description: |
      A reference to a cluster to which an entity is deemed to belong, with an associated confidence and similarity scores.

      A cluster is a set of entity mentions that have been determined to refer to the same real-world entity.
      Each cluster has a unique clusterId.
      
      A cluster reference is used to report the association between an entity mention and a cluster 
      of equivalence.
    attributes:
      cluster_id:
        description: |
          The identifier of the cluster/canonical entity that is considered equivalent to the
          subject entity mention that an `EntityMentionResolutionResponse` refers to.
        required: true
      confidence_score:
        range: float
        description: |
          A 0-1 value of how confident the ERE is about the equivalence between the subject entity mention
          and the target canonical entity.
        required: true
        minimum_value: 0.0
        maximum_value: 1.0
      similarity_score:
        range: float
        description: |
          A 0-1 score representing the pairwise comparison between a mention and a cluster (likely
          based on a representative representation).
        required: true
        minimum_value: 0.0
        maximum_value: 1.0

  Decision:
    description: |
      Canonical placement of an entity mention to a cluster.
      Represents the latest resolution decision (from ERE or curator override).
    attributes:
      id:
        description: Unique decision identifier
        required: true
      about_entity_mention:
        range: EntityMentionIdentifier
        description: The entity mention being resolved
        required: true
      current_placement:
        range: ClusterReference
        description: |
          The accepted cluster for this mention (latest from ERE or curator).
        required: true
      candidates:
        range: ClusterReference
        multivalued: true
        description: |
          Top-N alternative clusters proposed by ERE (for curation UI preview).
        required: true
      created_at:
        range: datetime
        description: When the decision was first created
        required: true
      updated_at:
        range: datetime
        description: When the decision was last updated (ERE refresh or curator action)

  UserAction:
    description: |
      Immutable record of a curator action on an entity mention resolution.
      Stored in the User Action Log for traceability and training.

      NOT related to ERE messages; represents curator intent only.
    attributes:
      id:
        description: Unique audit trail entry identifier
        required: true
      about_entity_mention:
        range: EntityMentionIdentifier
        description: The entity mention the curator acted upon
        required: true
      candidates:
        range: ClusterReference
        multivalued: true
        description: |
          The candidate clusters presented to the curator for selection.
          Ordered by confidence (same as shown in curation UI).
        required: true
      selected_cluster:
        range: ClusterReference
        description: |
          The cluster selected by the curator (if action was ACCEPT_TOP
          or ACCEPT_ALTERNATIVE). NULL if action was REJECT_ALL.
      action_type:
        range: UserActionType
        description: The type of action the curator performed
        required: true
      actor:
        description: User ID or identifier of the curator who performed the action
        required: true
      created_at:
        range: datetime
        description: Timestamp when the curator action was recorded
        required: true
      metadata:
        description: |
          JSON metadata providing context (e.g., curator notes, reasoning).

  CanonicalEntityIdentifier:
    description: |
      A logical identity construct providing a stable identity anchor.
      Represents a cluster of equivalent entity mentions.
    attributes:
      identifier:
        required: true
        description: Unique identifier for the canonical entity.
      equivalent_to:
        range: EntityMentionIdentifier
        multivalued: true
        description: Entity mentions that have been resolved to this canonical entity.
        required: true