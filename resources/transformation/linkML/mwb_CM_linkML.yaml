id: http://publications.europa.eu/ontology/ers
name: ERS
description: Mapping Workbench project v2
prefixes: 
  mwb: http://meaningfy.ws/mbw/
  linkml: https://w3id.org/linkml/

imports:
  - linkml:types
default_range: string

classes:
  AlignmentLink:
    class_uri: ers:AlignmentLink
    description: Represents either manual or automatic alignment. It can be also used to represent uncertain automatic alignments. Note:Uncertain automatic alignments will be used in the web curation app to show alternative alignments, but they'll never be used as a "primary" link provided for link curation.
    attributes:
      mentionIdentifier:
        slot_uri: ers:mentionIdentifier
        description: 
        range: uri
        required: true
        multivalued: false
      canonicalIdentifier:
        slot_uri: ers:canonicalIdentifier
        description: 
        range: uri
        required: true
        multivalued: false
      confidenceScore:
        slot_uri: ers:confidenceScore
        description: This indicates a confidence of belonging to a cluster:0 - 1 :automatically computed -1 :rejected by a person
        range: double
        required: true
        multivalued: false

  AlignmentLinkSet:
    class_uri: ers:AlignmentLinkSet
    description: The alignment link set is a collection of alignment links that form a set of possible alignments for the same entity. Usually the link set serves as a decision context defined by the alternative alignment links automatically derived. Then it is called a DecisionContext. In addition, to make a decission in the UI, it is necessary to access the entity representation, and the canonical entities representations. Note:There is no distinction between the main (canonical) and alternative (potential) alignments. This is determined by the confidence score (link with the highest score links to the canonical entity). Optionally, the list can be sorted by score in descending order.
    attributes:
      subjectMentionIdentifier:
        slot_uri: ers:subjectMentionIdentifier
        description: 
        range: uri
        required: true
        multivalued: false
      alignmentOption:
        slot_uri: ers:alignmentOption
        range: AlignmentLink
        required: true
        multivalued: true
      defaultAlignment:
        slot_uri: ers:defaultAlignment
        range: AlignmentLink
        required: true
        multivalued: false

  CanonicalEntity:
    class_uri: ers:CanonicalEntity
    description: No two links can exist for the same entity mention within the entire store. The alignment links MUST be to distinct entity mentions.
    attributes:
      identifier:
        slot_uri: ers:identifier
        description: 
        range: uri
        required: true
        multivalued: false
      created:
        slot_uri: ers:created
        description: 
        range: datetime
        required: true
        multivalued: false
      mentionLink:
        slot_uri: ers:mentionLink
        range: AlignmentLink
        required: true
        multivalued: true

  CanonicalEntityRegistry:
    class_uri: ers:CanonicalEntityRegistry
    description: 
    attributes:
      canonicalEntity:
        slot_uri: ers:canonicalEntity
        range: CanonicalEntity
        required: false
        multivalued: true

  CommunicationArtefact:
    class_uri: ers:CommunicationArtefact
    description: 

  Decission:
    class_uri: ers:Decission
    description: The decision object captures what (integration) action shall be taken given a DeciusionContex. Integration needed in 2 context when a response comes from ERE , we need to (step 1) store the alternatives + (step 2) automatically accept the top alternative if it is above and (step 3) upsert it into the canonical entity registry For automated actions ... For user actions ... The decision-making integration logic is as follows:1) Accepting the automatic alignment confidenceScore of the proposed alignment is left as is. 2) Reassigning the mention to another proposed entity confidenceScore of the chosen alignment is set to 1.0 confidenceScore of the proposed alignment is set to -1.0 other alternative alignments are note affected 2) Rejecting the automatic alignment confidenceScore of both proposed alignment and alternative alignments is set to -1.0
    attributes:
      indetifier:
        slot_uri: ers:indetifier
        description: 
        range: uri
        required: true
        multivalued: false
      createdAt:
        slot_uri: ers:createdAt
        description: 
        range: datetime
        required: true
        multivalued: false
      updatedAt:
        slot_uri: ers:updatedAt
        description: 
        range: datetime
        required: true
        multivalued: false
      acceptedAlignment:
        slot_uri: acceptedAlignment
        range: AlignmentLink
        required: false
        multivalued: false
      acceptedLink:
        slot_uri: ers:acceptedLink
        range: AlignmentLink
        required: false
        multivalued: false
      chosenAlternativeLink:
        slot_uri: chosenAlternativeLink
        range: AlignmentLink
        required: false
        multivalued: false
      decisionContext:
        slot_uri: ers:decisionContext
        range: AlignmentLinkSet
        required: true
        multivalued: false
      decisionStatus:
        slot_uri: ers:decisionStatus
        range: DecissionStatus
        required: true
        multivalued: false
      decisionAction:
        slot_uri: ers:decisionAction
        range: DecisionAction
        required: true
        multivalued: false

  DecissionsStore:
    class_uri: ers:DecissionsStore
    description: Working store Stores data for knowing the choice context training machine learning models
    attributes:
      decision:
        slot_uri: ers:decision
        range: Decission
        required: false
        multivalued: true

  EntityMention:
    class_uri: ers:EntityMention
    description: 
    attributes:
      identifier:
        slot_uri: ers:identifier
        description: Derived by a direct transformation/computing of available fields. Derived from the payload, i.e. getting the URI of the entityMention RDF payload. The ID is minted by the system, based on directly deriving it from the request ID + originator ID.
        range: uri
        required: true
        multivalued: false
      parsedDataRepresentation:
        slot_uri: ers:parsedDataRepresentation
        description: data are parsed/computed before storage in the ERS. Note:this could be lazy parsing because it is only for LinkCuration.
        range: string
        required: true
        multivalued: false
      type:
        slot_uri: ers:type
        range: EntityType
        required: true
        multivalued: false

  RequestRecord:
    class_uri: ers:RequestRecord
    description: This is stored in the system of records.
    attributes:
      requestIdentifier:
        slot_uri: ers:requestIdentifier
        description: 
        range: uri
        required: true
        multivalued: false
      originatorIdentifier:
        slot_uri: ers:originatorIdentifier
        description: 
        range: uri
        required: true
        multivalued: false
      created:
        slot_uri: ers:created
        description: 
        range: datetime
        required: true
        multivalued: false
      dataFormat:
        slot_uri: ers:dataFormat
        description: 
        range: string
        required: true
        multivalued: false
      payload:
        slot_uri: ers:payload
        description: 
        range: string
        required: true
        multivalued: false
      entityMention:
        slot_uri: ers:entityMention
        range: EntityMention
        required: false
        multivalued: false
      type:
        slot_uri: ers:type
        range: EntityType
        required: true
        multivalued: false

  SystemOfRequestRecords:
    class_uri: ers:SystemOfRequestRecords
    description: 
    attributes:
      record:
        slot_uri: ers:record
        range: RequestRecord
        required: false
        multivalued: true


enums:
  DecisionAction:
    description: 
    permissible_values:
      ers:acceptTop:
        description: 
      ers:acceptAlternative:
        description: 
      ers:rejectAll:
        description: This could mean just reverting back to default Cluster, or it could mean also sending a new request to resolve the same entity (this time with negative cluster examples) ... TBD
  DecissionStatus:
    description: 
    permissible_values:
      ers:automaticConfident:
        description: 
      ers:pendingManualReview:
        description: 
      ers:manuallyReviewed:
        description: 
  EntityType:
    description: 
    permissible_values:
      ers:organisation:
        description: 
      ers:procedure:
        description: 
