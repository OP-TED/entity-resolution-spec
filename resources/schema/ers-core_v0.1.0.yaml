id: https://data.europa.eu/ers/schema
name: ersServiceDataSchema
description: A LinkML schema for the ERS Services.
version: 0.1.0
imports:
  - linkml:types
prefixes:
  linkml: https://w3id.org/linkml/
  ers: https://data.europa.eu/ers/schema/
default_prefix: ers
default_range: string

classes:

  RequestOrResponseMixin:
    description: |
      Root mixin to represent attributes common to both requests and results.
    mixin: true
    abstract: true # should be implied by mixin, but just in case
    attributes:
      type:
        description: |
          The type of the request or result.

          As per LinkML specification, `designates_type` is used here in order to allow for this
          slot to tell the concrete subclass that an instance (such as a JSON object) belongs to.

          In other words, a particular request will have `type` set with values like 
          `EntityResolutionRequest` or `EntityResolutionResult`
        designates_type: true
        required: true
      metadata:
        description: |
          An optional arbitrary dictionary of further request metadata.
        # TODO: I can't make Any to work, see https://github.com/linkml/linkml/issues/2992
        # range: Any

        # TODO: are we fine with it supporting JSON only, or should it be a string/blob, and 
        # make room for any of JSON, XML, RDF, etc, like entityData?


  Request:
    description: |
      Root class to represent all the requests sent to the ERE.
    abstract: true
    mixins:
      - RequestOrResponseMixin
    attributes:
      requestId:
        description: |
          A string representing the unique ID of this request.
        required: true
      originator:
        description: |
          The ID or URI of the request originator.
        required: true



  Response:
    description: |
      Root class to represent all the responses sent by the ERE.
    abstract: true
    mixins:
      - RequestOrResponseMixin
    attributes:
      # We decided we don't need a responseId for the moment
      # TODO: Do we need metadata? (Not mentioned in the original spec)
      requestId:
        description: |
          A string representing the unique ID of the request this response is about.
        required: true



  EntityResolutionRequest:
    is_a: Request
    description: |
      An entity resolution request sent to the ERE, containing the entity to be resolved.
    attributes:
      entity:
        range: Entity
        description: |
          The data about the entity to be resolved.
        required: true
    examples:
      - value: |
          {
            "type": "EntityResolutionRequest",            
            "entity": 
            { 
              "type": "http://www.w3.org/ns/org#Organization",
              "id": "http://data.europa.eu/ers/id/324fs3r345vx-aa32wa",
              "entityData": "epd:ent005 a org:Organization; ...   cccev:telephone \"+44 1924306780\" .",
              "entityDataFormat": "text/turtle"
            },
            "requestId": "324fs3r345vx",
            "originator": "TED SWS pipeline",
            "metadata": {
              "originator system": "VocBench editor",
              "originator timestamp": "23748737643"
            }
          }



  EntityResolutionResponse:
    is_a: Response
    description: |
      An entity resolution response sent by the ERE.
      
      This contains a reference to the canonical entity that the ERE has associated to the original 
      entity in the request. It also reports a confidence score for the established association.
    attributes:
      canonicalEntity:
        range: CanonicalEntity
        description: |
          The canonical entity that the ERE has associated to the original entity.
          This includes the canonical entity URI and its type.
        required: true
      sourceEntityId:
        description: |
          The ID or URI of the original entity that has been resolved.
        required: true
      confidenceLevel:
        range: float
        description: |
          A 0-1 value of how confident the ERE is about associating the original entity
          with the canonical entity's cluster.
    examples:
      - value: |
          {
            "type": "EntityResolutionResponse",
            "sourceEntityId": "http://data.europa.eu/ers/id/324fs3r345vx-q11rea",
            "confidenceLevel": 0.91,
            "requestId": "324fs3r345vx"
            "canonicalEntity": 
            { 
              "type": "http://www.w3.org/ns/org#Organization",
              "id": "http://data.europa.eu/ers/id/324fs3r345vx-aa32wa",
              "entityData": "epd:ent001 a org:Organization; ...   cccev:telephone \"+441924306780\" .",
              "entityDataFormat": "text/turtle"
            }
          }
  ErrorResponse:
    is_a: Response
    description: |
      Response sent by the ERE when some error/exception occurs while processing a request.
      For instance, this may happen if the request is malformed or some internal error happens.

      The attributes of this class are based on [RFC-9457](https://datatracker.ietf.org/doc/html/rfc9457).
    attributes:
      errorType:
        description: |
          A string representing the error type, eg, the FQN of the raised exception.

          This corresponds to RFC-9457's `type`.
        required: true
      errorTitle:
        description: |
          A human readable brief message about the error that occurred.

          This corresponds to RFC-9457's `title`.
      errorDetail:
        description: |
          A human readable detailed message about the error that occurred.

          This corresponds to RFC-9457's `detail`.
      
      errorTrace:
        description: |
          A string representing a (stack) trace of the error that occurred.

          This is optional and typically used for debugging purposes only, since
          exposing this kind of server-side information is a security risk.
    examples:
      - value: |
          {
            "type": "ErrorResponse",
            "requestId": "324fs3r345vx",
            "errorType": "ere.exceptions.MalformedRequestError",
            "errorTitle": "The entity data is missing in the request",
            "errorDetail": "The 'entity' attribute is required in EntityResolutionRequest message",
            // Optional and not recommended for production use
            "errorTrace": "Traceback (most recent call last):\n  File \"/app/ere/service.py\", line 45, in process_request\n..."
          }


  Entity:
    description: |
      An entity is a representation of a real-world entity, as provided by the ERS.
      It contains the entity data (e.g. RDF description) along with metadata about
      the entity, such as its type and the data format used to represent it.
    attributes:
      id:
        # TODO: Can't make it more precise, it should be string or URI, 
        # see https://github.com/linkml/linkml/issues/2992
        # It applies to sourceEntityId in EntityResolutionResponse too
        range: string
        description: |
          A string containing the entity ID or URI (set by the ERS or, for canonical entities, by the ERE).
          
          Note that the ID isn't mandatory when an entity is submitted for resolution, since the initial input
          might be something like unstructured text, where the entity and its ID is to be recognised.        
        required: false
      type:
        description: |
          A string representing the entity type URI (based on CET).

          Note that we don't use the `designates_type` thing here, since entities or canonical entities 
          are always used in clearly distinct contexts.
        required: true
      entityDataFormat:
        description: |
          A string about the MIME format of `entityData` (e.g. text/turtle, application/ld+json)
      entityData:
        description: |
          A code string representing the entity details (eg, RDF description).



  CanonicalEntity:
    is_a: Entity  
    description: |
      A canonical entity is an entity that the ERE has created during the resolution process
      of ERS entities.

      TODO: we don't support lineage for the moment, see the ERE contract document.
    attributes:
      id:
        range: uri
        description: |
          The (canonical) URI of the canonical entity. This restricts the parent range to URIs only.
          
          Contrary to `Entity.id`, this is always known/required for canonical entities.
        required: true

  

  RebuildRequest:
    is_a: Request
    description: |
      A request to reset all the resolutions computed so far and rebuild them as 
      requests about old entities arrive again (and build new entities from scratch).
      
      It is expected that the ERE client re-sends all the entities to be resolved again,
      using `EntityResolutionRequest` messages exactly as the first time the resolutions 
      were built. This implies the a client like the ERS logs/persists the entities it receives
      to resolve and also saves manual overriding of ERE results.



  RebuildResponse:
    is_a: Response
    description: |
      A response to a `RebuildRequest`, confirming that the rebuild process has started.

      This should carry the `requestId` attribute.

