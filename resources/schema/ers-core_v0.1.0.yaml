id: https://data.europa.eu/ers/schema
name: ersServiceDataSchema
description: A LinkML schema for the ERS Services.
version: 0.1.0
imports:
  - linkml:types
prefixes:
  linkml: https://w3id.org/linkml/
  ers: https://data.europa.eu/ers/schema/
default_prefix: ers
default_range: string

classes:

  ERECommunicationArtefact:
    description: |
      Root abstraction to represent attributes common to both requests and results.
      This is modelled as a mixin in LinkML (so that it can't be instantiated directly).
    mixin: true
    abstract: true # should be implied by mixin, but just in case
    attributes:
      type:
        description: |
          The type of the request or result.

          As per LinkML specification, `designates_type` is used here in order to allow for this
          slot to tell the concrete subclass that an instance (such as a JSON object) belongs to.

          In other words, a particular request will have `type` set with values like 
          `EntityMentionResolutionRequest` or `EntityResolutionResult`
        designates_type: true
        required: true
      metadata:
        description: |
          An optional arbitrary dictionary of further request metadata.
        # TODO: I can't make Any to work, see https://github.com/linkml/linkml/issues/2992
        # range: Any

        # TODO: are we fine with it supporting JSON only, or should it be a string/blob, and 
        # make room for any of JSON, XML, RDF, etc, like entityData?


  ERERequest:
    description: |
      Root class to represent all the requests sent to the ERE.
    abstract: true
    mixins:
      - ERECommunicationArtefact
    attributes:
      requestId:
        description: |
          A string representing the unique ID of this request.
        required: true
      originator:
        description: |
          The ID or URI of the request originator.
        required: true
      creationTime:
        range: datetime
        description: |
          The timestamp when the request was created.



  EREResponse:
    description: |
      Root class to represent all the responses sent by the ERE.
    abstract: true
    mixins:
      - ERECommunicationArtefact
    attributes:
      # We decided we don't need a responseId for the moment
      requestId:
        description: |
          A string representing the unique ID of the request this response is about.
        required: true



  EntityMentionResolutionRequest:
    is_a: ERERequest
    description: |
      An entity resolution request sent to the ERE, containing the entity to be resolved.
    attributes:
      entityMention:
        range: EntityMention
        description: |
          The data about the entity to be resolved.
        required: true
      rejectedCanonicalIdentifiers:
        description: |
          When this is present, the request is a refresh request: it is asking that the entity 
          is resolved again and the clusters/canonical entities that were previously proposed 
          as resolution are now ignored.

          The exact reaction to this is implementation dependent. In the simplest case, the ERE
          might just create a singleton cluster with this entity as member. In a more advanced 
          case, it might recompute the similarity with more advanced algorithms or use updated
          data.
        range: uri
        multivalued: true
    examples:
      - description: a regular request
        value: | 
          {
            "type": "EntityMentionResolutionRequest",            
            "entityMention": 
            { 
              "type": "http://www.w3.org/ns/org#Organization",
              // As said above, there is always a way to compute this
              "identifier": "http://data.europa.eu/ers/id/324fs3r345vx-aa32wa",
              "payload": "epd:ent005 a org:Organization; ...   cccev:telephone \"+44 1924306780\" .",
              "dataFormat": "text/turtle",
              // As Said above, this is optional and JSON-LD is just an example of what it could rendered.
              "jsonRepresentation": {
                "@context": {
                  "org": "http://www.w3.org/ns/org#",
                  "cccev": "https://data.europa.eu/cc/cefact/code/"
                },
                "@id": "http://data.europa.eu/ers/id/324fs3r345vx-aa32wa",
                "@type": "org:Organization",
                "cccev:telephone": "+44 1924306780"
              }
            },
            "requestId": "324fs3r345vx",
            "originator": "TED SWS pipeline",
            "creationTime": "2026-01-14T12:34:56Z",
            "metadata": {
              "originator system": "VocBench editor",
              "originator timestamp": "23748737643"
            }
          }
      - description: a refresh request (ie, carrying a rejection list)
        value: |
          {
            "type": "EntityMentionResolutionRequest",            
            "entityMention": 
            { 
              "type": "http://www.w3.org/ns/org#Organization",
              "identifier": "http://data.europa.eu/ers/id/324fs3r345vx-aa32wa",
              "payload": "epd:ent005 a org:Organization; ...   cccev:telephone \"+44 1924306780\" .",
              "dataFormat": "text/turtle"
            },
            "rejectedCanonicalIdentifiers": [
              "http://data.europa.eu/ers/id/324fs3r345vx-bb45we",
              "http://data.europa.eu/ers/id/324fs3r345vx-cc67ui"
            ],
            "requestId": "324fs3r345vx01",
            "originator": "TED SWS pipeline",
            "creationTime": "2026-01-14T12:40:56Z"
          }



  EntityMentionResolutionResponse:
    is_a: EREResponse
    description: |
      An entity resolution response sent by the ERE.
      
      This links an `AlignmentLinkSet`, to represent possible resolutions (see the attribute definition).
    attributes:
      alignmentLinkSet:
        range: AlignmentLinkSet
        description: |
          The set of alignment links representing the candidate canonical entities/clusters
          that the entity mention in the original request could align to (be equivalent to).

          **Note**: for the moment, this is not multi-valued, since we don't support batch requests (yet?),
          thus there is only one set in a response, that resolves for the single entity mention in the
          original request (with multiple alignment candidates). If, in the future, we support batch requests,
          then we might need to return one alignment link set per entity mention in a request.
        required: true
    examples:
      - value: |
          {
            "type": "EntityMentionResolutionResponse",
            "requestId": "324fs3r345vx",
            "alignmentLinkSet": {
              "subjectEntityMentionIdentifier": "http://data.europa.eu/ers/id/324fs3r345vx-q11rea",
              "alignmentOptions": [
                { 
                  "canonicalIdentifier": "http://data.europa.eu/ers/id/324fs3r345vx-aa32wa",
                  "confidenceScore": 0.91
                },
                { 
                  "canonicalIdentifier": "http://data.europa.eu/ers/id/324fs3r345vx-bb45we",
                  "confidenceScore": 0.65
                }
              ]
            }
          }
              


  EREErrorResponse:
    is_a: EREResponse
    description: |
      Response sent by the ERE when some error/exception occurs while processing a request.
      For instance, this may happen if the request is malformed or some internal error happens.

      The attributes of this class are based on [RFC-9457](https://datatracker.ietf.org/doc/html/rfc9457).
    attributes:
      errorType:
        description: |
          A string representing the error type, eg, the FQN of the raised exception.

          This corresponds to RFC-9457's `type`.
        required: true
      errorTitle:
        description: |
          A human readable brief message about the error that occurred.

          This corresponds to RFC-9457's `title`.
      errorDetail:
        description: |
          A human readable detailed message about the error that occurred.

          This corresponds to RFC-9457's `detail`.
      
      errorTrace:
        description: |
          A string representing a (stack) trace of the error that occurred.

          This is optional and typically used for debugging purposes only, since
          exposing this kind of server-side information is a security risk.
    examples:
      - value: |
          {
            "type": "EREErrorResponse",
            "requestId": "324fs3r345vx",
            "errorType": "ere.exceptions.MalformedRequestError",
            "errorTitle": "The entity data is missing in the request",
            "errorDetail": "The 'entity' attribute is required in EntityMentionResolutionRequest message",
            // Optional and not recommended for production use
            "errorTrace": "Traceback (most recent call last):\n  File \"/app/ere/service.py\", line 45, in process_request\n..."
          }


  EntityMention:
    description: |
      An entity mention is a representation of a real-world entity in the ERS. It must have 
      a data content and a data format, so that components like the ERE can use them for resolution.
      
      Moreover, an entity mention must have a computed identifier (see below).
    attributes:
      identifier:
        # TODO: we don't know how to specify it's a computed property in LinkML.
        range: uri
        description: |
          An URI identifying the entity.
          
          While mandatory, this can be computed, using same function that depends on the entity payload.
          In that case, **there must be** a single function in the whole ERS (including the ERE) that
          computes the same identifier for the same payload, eg, a hash, an RDF URI extractor. This is
          needed for the resolution results to refer to the correct request entities.        
        required: true
      type:
        description: |
          A string representing the entity type URI (based on CET).

          Note that we don't use the `designates_type` thing here, since entities or canonical entities 
          are always used in clearly distinct contexts.
        required: true
      datFormat:
        description: |
          A string about the MIME format of `payload` (e.g. text/turtle, application/ld+json)
      payload:
        description: |
          A code string representing the entity details (eg, RDF description).
      jsonRepresentation:
        description: |
          An optional JSON representation of the entity, which is usually achieved from the payload.
          This is mainly useful for the curation app.
  

  AlignmentLinkSet:
    description: |
      A set of alignment links to a referred entity.

      Each link in the set represents an entity that might be equivalent to the referred entity,
      see `AlignmentLink` for details.
    attributes:
      subjectEntityMentionIdentifier: 
        range: uri
        description: |
          The identifier of the entity mention that is the subject of these alignment links.
          This must match the `identifier` attribute of an `EntityMention` that a resolution response
          refers to.
        required: true
      alignmentOptions:
        description: |
          A list of possible matches (alignment links) between the subject entity mention
          and candidate canonical entities.

          It is recommended that these are sorted by descending confidence score, although
          that is not mandatory.
        range: AlignmentLink
        multivalued: true
        required: true


  AlignmentLink:
    description: |
      An alignment link representing a possible equivalence between an entity mention in the
      `AlignmentLinkSet` the link belongs to, and a canonical entity, together with a confidence score.

      A semi-formal representation:

      ```
        for each (canonicalIdentifier, cconfidenceScore) in AlignmentLinkSet.alignmentOptions:
          entity(subjectEntityMentionIdentifier)  ==  entity(mentionIdentifier) 
            with score = confidenceScore
      ```
    attributes:
      canonicalIdentifier:
        range: uri
        description: |
          The identifier of the cluster/canonical entity that is considered equivalent to the
          subject entity mention in the `AlignmentLinkSet` the link belongs to.
        required: true
      confidenceScore:
        range: float
        description: |
          A 0-1 value of how confident the ERE is about the equivalence between the subject entity mention
          and the target canonical entity.
        required: true


  FullRebuildRequest:
    is_a: ERERequest
    description: |
      A request to reset all the resolutions computed so far and rebuild them as 
      requests about old entities arrive again (and build new entities from scratch).
      
      It is expected that the ERE client re-sends all the entities to be resolved again,
      using `EntityMentionResolutionRequest` messages exactly as the first time the resolutions 
      were built. This implies the a client like the ERS logs/persists the entities it receives
      to resolve and also saves manual overriding of ERE results.



  FullRebuildResponse:
    is_a: EREResponse
    description: |
      A response to a `FullRebuildRequest`, confirming that the rebuild process has started.

      This should carry the `requestId` attribute.

