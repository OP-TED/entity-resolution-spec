id: http://publications.europa.eu/ontology/ers
name: ERS
description: Mapping Workbench project v2
prefixes: 
  mwb: http://meaningfy.ws/mbw/
  linkml: https://w3id.org/linkml/

imports:
  - linkml:types
default_range: string

classes:
  EntityMentionResolutionRequest:
    class_uri: ers:EntityMentionResolutionRequest

    description: We shall always have one record per resolution request. Do not make the mistake of including multiple records into one request. Use bulk for that. Future optimisation.
    attributes:
      draftCanonicalIdentifier:
        slot_uri: ers:draftCanonicalIdentifier
        description: This is a way to ensure that the governance of Canonical URIs stays with the ERS.
        range: uri
        required: true
        multivalued: false
      requestRecords:
        slot_uri: ers:requestRecords
        range: RequestRecord
        required: true
        multivalued: true

  EntityMentionResolutionResponse:
    class_uri: ers:EntityMentionResolutionResponse
    is_a: Response
    description: Supports one entity resolution or bulk resolution response. One response with multiple possible assignments. WE shall use this option (not multiple responses for one request) because:- the ERE will always produce all the possible assignments at the same time, - it facilitates easier integration, on the ERS side, into the canonical registry.
    attributes:
      alignmentLinks:
        slot_uri: ers:alignmentLinks
        range: AlignmentLinkSet
        required: true
        multivalued: true

  FullRebuildRequest:
    class_uri: ers:FullRebuildRequest

    description: This is a request to re-create the clusters within the ERE, given the current (cached) data. It shall re-use the available cluster/canonical URIs, but the memberships may differ. Or possibly will provide new canonical URIs, which then will have to be accomodated by the ERS.

  GetLatestSeenDecisionTimestamp:
    class_uri: ers:GetLatestSeenDecisionTimestamp

    description:

  GetLatestSeenMentionRecordTimestampResponse:
    class_uri: ers:GetLatestSeenMentionRecordTimestampResponse
    is_a: Response
    description: 
    attributes:
      latestTimestamp:
        slot_uri: ers:latestTimestamp
        description: 
        range: datetime
        required: true
        multivalued: false

  GetLatestSeenRecordTimestamp:
    class_uri: ers:GetLatestSeenRecordTimestamp

    description: ERS requests fro the latest/newest entity mention known by the ERE. This is determining the scope of data.

  LatestSeenCurationTimestampResponse:
    class_uri: ers:LatestSeenCurationTimestampResponse
    is_a: Response
    description: 
    attributes:
      latestTimestamp:
        slot_uri: ers:latestTimestamp
        description: 
        range: datetime
        required: true
        multivalued: false

  PostCurationDecisions:
    class_uri: ers:PostCurationDecisions
    is_a: Response
    description: 
    attributes:
      curationDecisions:
        slot_uri: ers:curationDecisions
        range: Decission
        required: true
        multivalued: true

  PostEntityMentionRecords:
    class_uri: ers:PostEntityMentionRecords

    description: Initiated by the ERS, sending over the entity mention records, without expecting any resolutions in response.
    attributes:
      records:
        slot_uri: ers:records
        range: RequestRecord
        required: true
        multivalued: true


enums:
