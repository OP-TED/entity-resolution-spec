        multivalued: true

  CommunicationArtefact:
    class_uri: ers:CommunicationArtefact
    description: 

  Decission:
    class_uri: ers:Decission
    description: The decision object captures what (integration) action shall be taken given a DeciusionContex. Integration needed in 2 context when a response comes from ERE , we need to (step 1) store the alternatives + (step 2) automatically accept the top alternative if it is above and (step 3) upsert it into the canonical entity registry For automated actions ... For user actions ... The decision-making integration logic is as follows:1) Accepting the automatic alignment confidenceScore of the proposed alignment is left as is. 2) Reassigning the mention to another proposed entity confidenceScore of the chosen alignment is set to 1.0 confidenceScore of the proposed alignment is set to -1.0 other alternative alignments are note affected 2) Rejecting the automatic alignment confidenceScore of both proposed alignment and alternative alignments is set to -1.0
    attributes:
      indetifier:
        slot_uri: ers:indetifier
        description: 
        range: uri
        required: true
        multivalued: false
      createdAt:
        slot_uri: ers:createdAt
        description: 
        range: datetime
        required: true
        multivalued: false
      updatedAt:
        slot_uri: ers:updatedAt
        description: 
        range: datetime
        required: true
        multivalued: false
      acceptedAlignment:
        slot_uri: acceptedAlignment
        range: AlignmentLink
        required: false
        multivalued: false
      acceptedLink:
        slot_uri: ers:acceptedLink
        range: AlignmentLink
        required: false
        multivalued: false
      chosenAlternativeLink:
        slot_uri: chosenAlternativeLink
        range: AlignmentLink
        required: false
        multivalued: false
      decisionContext:
        slot_uri: ers:decisionContext
        range: AlignmentLinkSet
        required: true
        multivalued: false
      decisionStatus:
        slot_uri: ers:decisionStatus
        range: DecissionStatus
        required: true
        multivalued: false
      decisionAction:
        slot_uri: ers:decisionAction
        range: DecisionAction
        required: true
        multivalued: false

  DecissionsStore:
    class_uri: ers:DecissionsStore
    description: Working store Stores data for knowing the choice context training machine learning models
    attributes:
