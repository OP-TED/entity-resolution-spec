id: http://publications.europa.eu/ontology/ers
name: ERS
description: Mapping Workbench project v2
prefixes: 
  mwb: http://meaningfy.ws/mbw/
  linkml: https://w3id.org/linkml/

imports:
  - linkml:types
default_range: string

classes:
  AlignmentLink:
    class_uri: ers:AlignmentLink
    description: Represents either manual or automatic alignment. It can be also used to represent uncertain automatic alignments. Note:Uncertain automatic alignments will be used in the web curation app to show alternative alignments, but they'll never be used as a "primary" link provided for link curation.
    attributes:
      mentionIdentifier:
        slot_uri: ers:mentionIdentifier
        description: 
        range: uri
        required: true
        multivalued: false
      canonicalIdentifier:
        slot_uri: ers:canonicalIdentifier
        description: 
        range: uri
        required: true
        multivalued: false
      confidenceScore:
        slot_uri: ers:confidenceScore
        description: This indicates a confidence of belonging to a cluster:0 - 1 :automatically computed -1 :rejected by a person
        range: double
        required: true
        multivalued: false

  AlignmentLinkSet:
    class_uri: ers:AlignmentLinkSet
    description: The alignment link set is a collection of alignment links that form a set of possible alignments for the same entity. Usually the link set serves as a decision context defined by the alternative alignment links automatically derived. Then it is called a DecisionContext. In addition, to make a decission in the UI, it is necessary to access the entity representation, and the canonical entities representations. Note:There is no distinction between the main (canonical) and alternative (potential) alignments. This is determined by the confidence score (link with the highest score links to the canonical entity). Optionally, the list can be sorted by score in descending order.
    attributes:
      subjectMentionIdentifier:
        slot_uri: ers:subjectMentionIdentifier
        description: 
        range: uri
        required: true
        multivalued: false
      alignmentOption:
        slot_uri: ers:alignmentOption
        range: AlignmentLink
        required: true
        multivalued: true
      defaultAlignment:
        slot_uri: ers:defaultAlignment
        range: AlignmentLink
        required: true
        multivalued: false

  CanonicalEntity:
    class_uri: ers:CanonicalEntity
    description: No two links can exist for the same entity mention within the entire store. The alignment links MUST be to distinct entity mentions.
    attributes:
      identifier:
        slot_uri: ers:identifier
        description: 
        range: uri
        required: true
        multivalued: false
      created:
        slot_uri: ers:created
        description: 
        range: datetime
        required: true
        multivalued: false
      mentionLink:
        slot_uri: ers:mentionLink
        range: AlignmentLink
        required: true
        multivalued: true

  CanonicalEntityRegistry:
    class_uri: ers:CanonicalEntityRegistry
    description: 
    attributes:
